name: ci

# The Git Crafter CI standard (templates/ci/README.md): this repo calls Git Crafter's reusable workflow, which runs each
# job on GitHub's standard hosted runners. Copy this file to .github/workflows/ci.yml and set the paths and
# commands. It pins a Git Crafter release by full commit SHA with its version comment, such as # v4.0.0; Dependabot's
# github-actions entry bumps it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request's older run; a push to main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: SoulCraft-Org/git-crafter/.github/workflows/ci-standard.yml@dd03762898c5cbd816b7a093307c643dcc80a5c3 # v4.0.0
    with:
      paths: |
        src/**
        package.json
        package-lock.json
      short: npm run lint
      standard: npm test
