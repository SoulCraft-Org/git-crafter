name: pages

# Git Crafter's pages for this repo (Git Crafter templates/ci/README.md): the Process page and the Quality, Speed and
# Consumption page, built by Git Crafter's actions/pages from the two starter configs and published to GitHub Pages.
# Copy this file to .github/workflows/pages.yml. Keep the pin a full commit SHA with its version comment, such as # v6.0.0; Dependabot's
# github-actions entry bumps it with ci.yml's. A pull request builds the pages and runs the docs.unmapped gate, so its
# trigger lists the doc globs; only a push to main publishes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.md"
      - "quality/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# A deploy always finishes; a newer push queues behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The collectors read this repo's pull requests, runs, checks and issues; a read refused is not measured.
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      # Dependabot's open alerts, read live on every run; without it they come from the last local snapshot.
      vulnerability-alerts: read
    steps:
      # Full history: the docs collector dates each doc against its area's last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: SoulCraft-Org/git-crafter/actions/pages@dd999dcac64873f77165609f3cc9fde4da49d332 # v6.0.0
        with:
          pages: process quality
          config: quality/process/config.json
          quality-config: quality/config.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: quality/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
