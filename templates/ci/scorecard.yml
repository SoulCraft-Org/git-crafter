name: scorecard

# OPTIONAL, for public adopters: copy to .github/workflows/scorecard.yml.
# OpenSSF Scorecard grades the repo's supply-chain practices, 0 to 10, and
# publishes the score to api.scorecard.dev, where the Quality page can read
# it (github.com/ossf/scorecard-action, read 2026-11-12). Free for public
# repos; on a private one it spends minutes and publishes nothing, so skip it.
#
# ADVISORY: no ruleset requires this check. It runs on the default branch
# only, never on a pull request, so no fork's code runs with id-token.
# Each action is pinned to a commit at least two weeks old. From on: down it is Git Crafter's own
# .github/workflows/scorecard.yml, which passes the CI standard: top-level read only, no SARIF upload.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      # Publishing the result signs it with the run's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: true
