name: claude-review

# OPTIONAL, for adopters: copy to .github/workflows/claude-review.yml, and copy claude_review.py to tools/ and
# requirements-claude-review.txt to tools/ (both sit beside this file). Run gh actions-lock after copying so the lockfile
# lists checkout and setup-python.
#
# ADVISORY: no ruleset requires this check. Claude security-reviews each same-repo pull request that changes code or
# workflows and posts one comment whose first line starts "Security review:". security.claude_review_share counts that
# comment (params.review_authors, params.security_review).
#
# KEYLESS. The job asks GitHub for a short-lived OIDC token and trades it for an Anthropic token through workload identity
# federation, so no API key or OAuth token is stored. The three ANTHROPIC_* values are identifiers, not keys. Set them as
# repository Actions secrets: ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID.
# Never add ANTHROPIC_API_KEY: a static key wins over federation. Recipe: Anthropic workload identity federation, GitHub
# Actions page. The rule's subject should name this repo's pull_request events.
#
# The Claude plan cannot pay for this. It spends the monthly API credit, one call of at most 6,000 output tokens
# (thinking included) per push (rules/compute.md, Money). Set the workspace's monthly limit and leave auto-reload off.
#
# Proven live in Compute Crafter (PR 279, 2026-11-25). Three traps it found: a reply cut at max_tokens is never posted
# (the script checks the stop reason); the token file is written after the install step, and the install takes wheels
# only (--only-binary), so it runs no build code; and a reusable action missing from actions.lock fails the run at
# startup, not in a step.
#
# No pull_request_target: a pull request's code never runs with a secret from outside the repo. A fork's pull request
# gets no secrets, so the job skips it. The script sends the diff as data, clipped at 60,000 characters, and says so in
# the comment when it clips.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "**/*.mjs"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.py"
      - "**/*.sh"
      - "tools/**"
      - "actions/**"
      - ".github/workflows/**"
      - ".claude/settings.json"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: claude-review
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-claude-review.txt

      - name: Install the review client
        run: |
          python3 -m pip install --quiet --only-binary=:all: -r tools/requirements-claude-review.txt

      - name: Fetch the GitHub OIDC token
        shell: bash
        run: |
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/oidc-jwt" >> "$GITHUB_ENV"
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -er .value > "$RUNNER_TEMP/oidc-jwt"

      - name: Review the pull request
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 -I tools/claude_review.py
