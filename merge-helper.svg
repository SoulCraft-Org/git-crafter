  @media (prefers-color-scheme:dark){.bg{fill:#1a1a19;stroke:#3a3a37}.p{fill:#f0efec}.s{fill:#c3c2b7}.track{fill:#33332f}.box{stroke:#55544e}.arrow{stroke:#c3c2b7}.fill{fill:#3987e5}}</style><rect class="bg" x="0.5" y="0.5" width="759" height="179" rx="12"/><circle class="fill" cx="30" cy="32" r="6"/><text class="p b" x="44" y="36">Speed</text><text class="s" x="144" y="36">guard</text><rect class="box" x="24" y="60" width="157" height="96" rx="8"/><text class="s b" x="36" y="84">1  Need</text><text class="p" x="36" y="110">merges retyped by</text><text class="p" x="36" y="128">hand; three slips on</text><text class="p" x="36" y="146">2026-11-23</text><path class="arrow" d="M187 108 h14 m-6 -5 l6 5 l-6 5"/><rect class="box" x="209" y="60" width="157" height="96" rx="8"/><text class="s b" x="221" y="84">2  Change</text><text class="p" x="221" y="110">a merge tool: base</text><text class="p" x="221" y="128">main, head unchanged,</text><text class="p" x="221" y="146">latest run per check</text><path class="arrow" d="M372 108 h14 m-6 -5 l6 5 l-6 5"/><rect class="box" x="394" y="60" width="157" height="96" rx="8"/><text class="s b" x="406" y="84">3  Change</text><text class="p" x="406" y="110">waits out GitHub</text><text class="p" x="406" y="128">recomputing, merges</text><text class="p" x="406" y="146">stacks via the API</text><path class="arrow" d="M557 108 h14 m-6 -5 l6 5 l-6 5"/><rect class="box" x="579" y="60" width="157" height="96" rx="8"/><text class="s b" x="591" y="84">4  Done when</text><text class="p" x="591" y="110">the merging skill</text><text class="p" x="591" y="128">names it; its test</text><text class="p" x="591" y="146">passes</text></svg>
