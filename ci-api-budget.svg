<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" role="img"><title>Consumption: GitHub API left this hour 10 to 50. Need: a burst of PR pushes empties the hour. Change: PR runs replay the last good main save. Change: a page build spends fewer calls. Done when: 50% left after 10 pushes in an hour</title><style>
  .bg{fill:#fcfcfb;stroke:#d9d8d2}.p{fill:#0b0b0b}.s{fill:#52514e}.track{fill:#e6e5df}.box{fill:none;stroke:#c9c8c1}
  .arrow{fill:none;stroke:#52514e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fill{fill:#eb6834}
  text{font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.b{font-weight:600}.h{font-size:34px;font-weight:600}.u{font-size:14px;font-weight:400}
  @media (prefers-color-scheme:dark){.bg{fill:#1a1a19;stroke:#3a3a37}.p{fill:#f0efec}.s{fill:#c3c2b7}.track{fill:#33332f}.box{stroke:#55544e}.arrow{stroke:#c3c2b7}.fill{fill:#d95926}}</style><rect class="bg" x="0.5" y="0.5" width="759" height="271" rx="12"/><circle class="fill" cx="30" cy="32" r="6"/><text class="p b" x="44" y="36">Consumption</text><text class="s" x="144" y="36">ci</text><text class="s" x="24" y="68">GitHub API left this hour</text><text class="p h" x="24" y="108">10<tspan class="s"> → </tspan>50<tspan class="s u"> %</tspan></text><rect class="track" x="24" y="122" width="712" height="10" rx="5"/><rect class="fill" x="24" y="122" width="142" height="10" rx="5"/><rect class="box" x="24" y="152" width="157" height="96" rx="8"/><text class="s b" x="36" y="176">1  Need</text><text class="p" x="36" y="202">a burst of PR pushes</text><text class="p" x="36" y="220">empties the hour</text><path class="arrow" d="M187 200 h14 m-6 -5 l6 5 l-6 5"/><rect class="box" x="209" y="152" width="157" height="96" rx="8"/><text class="s b" x="221" y="176">2  Change</text><text class="p" x="221" y="202">PR runs replay the</text><text class="p" x="221" y="220">last good main save</text><path class="arrow" d="M372 200 h14 m-6 -5 l6 5 l-6 5"/><rect class="box" x="394" y="152" width="157" height="96" rx="8"/><text class="s b" x="406" y="176">3  Change</text><text class="p" x="406" y="202">a page build spends</text><text class="p" x="406" y="220">fewer calls</text><path class="arrow" d="M557 200 h14 m-6 -5 l6 5 l-6 5"/><rect class="box" x="579" y="152" width="157" height="96" rx="8"/><text class="s b" x="591" y="176">4  Done when</text><text class="p" x="591" y="202">50% left after 10</text><text class="p" x="591" y="220">pushes in an hour</text></svg>
