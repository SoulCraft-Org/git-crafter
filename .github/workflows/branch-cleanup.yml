name: branch-cleanup

# Deletes the head branch of a pull request closed without merging, while the branch still sits at the pull
# request's head, so GitHub can restore it from the pull request. GitHub's own setting deletes a branch only
# on merge (docs.github.com, Managing the automatic deletion of branches, read 2026-11-10), so closed ones
# piled up: 28 were deleted by hand on 2026-11-10 (insights.leftover_branches). No checkout and no action:
# a few gh api calls per closed pull request. A read or delete GitHub refuses leaves the branch and the run
# green: could not tidy, never a failure of the pull request.
# A daily sweep, not a pull_request_target run on every close. pull_request_target types cannot tell a merge
# from a plain close (docs.github.com, Events that trigger workflows, read 2026-11-23), so every merged pull
# request started a run whose one job skipped itself: 88 of the last 100 runs, each counted as light by
# ci.light_run_share. One scheduled run a day has no pull request's text in it at all, so no event field
# reaches the shell; the branch names it reads come from the API and pass a character check first.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  branch-cleanup:
    name: branch-cleanup
    runs-on: ubuntu-slim
    timeout-minutes: 10
    # Write, on this job alone: deleting a ref is a contents write.
    permissions:
      contents: write
      pull-requests: read
    steps:
      # The 100 pull requests updated last cover a day's closes many times over. The names and SHAs reach the
      # loop through a here-string and stay quoted; a name outside the plain ref characters is left alone.
      - name: Delete each unmerged pull request's branch that still sits at its head
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch 2>/dev/null || echo main)
          closed=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=closed -f sort=updated -f direction=desc -f per_page=100 \
            --jq ".[] | select(.merged_at == null and .head.repo.full_name == \"$GITHUB_REPOSITORY\") | [.head.ref, .head.sha] | @tsv" 2>/dev/null) || {
            say "Could not list closed pull requests; nothing tidied."; exit 0; }
          seen=0; deleted=0
          while IFS=$'\t' read -r BRANCH HEAD_SHA; do
            [ -n "$BRANCH" ] || continue
            seen=$((seen + 1))
            case "$BRANCH" in *[!A-Za-z0-9._/-]*) say "Left alone: a branch name with unusual characters."; continue;; esac
            if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then say "Left alone: $BRANCH is the default branch."; continue; fi
            # A long-lived branch carries protection; a pull request's own branch does not.
            prot=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --jq .protected 2>/dev/null || echo unknown)
            if [ "$prot" != "false" ]; then continue; fi
            tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null || true)
            if [ "$tip" != "$HEAD_SHA" ]; then continue; fi
            open=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$OWNER:$BRANCH" --jq length 2>/dev/null || echo unknown)
            if [ "$open" != "0" ]; then say "Left alone: an open pull request uses $BRANCH, or the list could not be read."; continue; fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null 2>&1; then
              deleted=$((deleted + 1)); say "Deleted $BRANCH at $HEAD_SHA; restore it from the pull request."
            else
              say "Could not delete $BRANCH; GitHub refused the call."
            fi
          done <<< "$closed"
          say "Read $seen unmerged closed pull requests; deleted $deleted branches."
