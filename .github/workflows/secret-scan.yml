name: secret-scan

# REQUIRED: the repo ruleset "code-os main: required CI" requires the secret-scan
# check on main, beside ci / ci-ok (gh api rules/branches/main, 2026-11-10; #486).
#
# gitleaks over the commits the run answers for (tools/secret_scan.sh): on a
# pull request its own commits, on a push to main every ancestor of the pushed
# commit. A credential that a later commit removed still fails the run. Other
# branches are not read, so a false positive on one branch fails only that
# branch's pull request. Values are redacted in the log; a finding prints its
# file, commit and rule id. It runs the MIT gitleaks release binary, not
# gitleaks/gitleaks-action, which needs a licence for organization repos.
# The tarball is pinned by version and by the SHA-256 from that release's
# gitleaks_8.30.1_checksums.txt (read 2026-11-02); a mismatch never installs.
# Identical copies run in other repos in the org: move the version and
# the SHA-256 in all of them together.
#
# No schedule: with the binary pinned, rerunning an unchanged history finds
# nothing new. No event input reaches a run: step.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    # A fixed GitHub-hosted label, never the raw CI_RUNNER variable (rules/compute.md).
    # ubuntu-slim: a scan of about 10 s bills 1 minute at 0.2 cents, not 0.6 (GitHub docs, Actions runner pricing, read 2026-11-10).
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the tip
          persist-credentials: false

      - name: Install gitleaks (pinned release, SHA-256 checked)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # tools/secret_scan.sh holds the scan: on a pull request the PR's own
      # commits (base..head), otherwise every ancestor of the pushed commit.
      # Its self-test runs the real binary in a throwaway repo: a key on
      # another branch is ignored, a key inside the pull request's own commits
      # fails though a later commit deleted it, and a scanner that dies reads
      # as broken (4), never clean. The fake key is built at run time.
      - name: Self-test (the scan's range, with a planted fake key)
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
        run: bash tools/secret_scan.sh --self-test

      - name: Scan the commits this run answers for
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tools/secret_scan.sh . "$PR_BASE" "${PR_HEAD:-$GITHUB_SHA}"
