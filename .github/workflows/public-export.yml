name: public-export

# Builds the public Git Crafter tree (tools/export_public.sh: tracked files less data/, but data/quality/, and the org's
# own config) and proves it stands alone: it collects its own data in CI, then runs the pages build, the generic
# scan (emails, /Users/<name> paths, key shapes) and the private-term scan (config/private-terms.txt, read from this
# checkout, never copied into the tree; a repo without the list skips that scan). Each step must pass. The scans print
# path, line and a term's number, never the term. The export and both scans always run; the rest runs only when the
# pull request, or the push to main since github.event.before, changes what shapes the tree (the scope step; no base
# means all of it). tools/verify.sh runs once, in verify.yml's ci / short, on the same commit (#861): here it took
# 83 s of a 282 s job (run 43110227680, 2026-11-11) and, in the last 100 pull request runs, failed only with
# verify.yml red too.
# A fork's pull request runs it with a read-only token, which is all it needs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# bash with pipefail, so a scan piped through tee still fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: public-export-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-export:
    # ubuntu-slim (1 vCPU, 15-minute job limit) at 0.2 cents a minute, not 0.6: the full run took about 3 minutes on 2 cores (Actions metrics, 2026-11-11).
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # The collector reads this repo's pull requests, runs and checks; a read the token refuses is not measured.
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
    env:
      PUBLIC: ${{ github.workspace }}/../public-export
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request or a push to main runs the tree's own install, collect
      # and build only when it changes what shapes the public tree: the
      # export, the scans, the org collect and its imports, and the files the
      # export drops or rewrites. Every other one runs the export and both
      # scans, and verify.yml tests the same commit. Of the last 100 pull
      # request runs (read 2026-11-11), a Verify step here failed 4 times, each
      # time with verify.yml red on the same commit, at a median 3.7 minutes
      # against 1.1, so the step is gone (#861). A push compares with github.event.before; a zero or missing base
      # (a new branch) sets heavy to true (ci_standard.py known_base).
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAVY: |
            .github/workflows/public-export.yml
            tools/export_public.sh
            tools/public_scan.py
            tools/collect_org.mjs
            tools/org_*.mjs
            tools/systems.mjs
            tools/workflows.mjs
            pages/library.mjs
            quality/config.mjs
            quality/overlay.mjs
            quality/score.mjs
            quality/text-rules.mjs
            tools/bash_guard_cases.json
            tools/bash_guard_rules.json
            config/*.json
            config/accounts/**
            config/private-terms.txt
            data/**
            manifest.json
            package.json
            package-lock.json
            .nvmrc
        run: python3 -I tools/ci_standard.py changes --paths="$HEAVY" --base="$BASE" --output=heavy

      - uses: actions/setup-node@v7.1.0
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      # A git repo, as the public one will be: the collector and tests read its tracked files.
      - id: export
        name: Export the public tree
        run: |
          bash tools/export_public.sh "$PUBLIC"
          git -C "$PUBLIC" init -q
          git -C "$PUBLIC" add -A
          git -C "$PUBLIC" -c user.name=export -c user.email=export@example.invalid commit -qm "public export"

      - name: Generic scan
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: python3 -I tools/public_scan.py generic "$PUBLIC" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Private-term scan
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        # The term list is the org's own and never ships, so the public repo has none and skips this scan.
        run: |
          if [ ! -f config/private-terms.txt ]; then
            echo "No config/private-terms.txt in this repo; the private-term scan runs where the list lives." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -I tools/public_scan.py terms "$PUBLIC" config/private-terms.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install the tree's packages
        if: ${{ !cancelled() && steps.export.outcome == 'success' && steps.scope.outputs.heavy == 'true' }}
        working-directory: ${{ env.PUBLIC }}
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      # No data/org.json ships, so the tree collects its own: the org is this repo's owner.
      - name: Collect
        if: ${{ !cancelled() && steps.export.outcome == 'success' && steps.scope.outputs.heavy == 'true' }}
        working-directory: ${{ env.PUBLIC }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/collect_org.mjs

      - name: Pages build
        if: ${{ !cancelled() && steps.export.outcome == 'success' && steps.scope.outputs.heavy == 'true' }}
        working-directory: ${{ env.PUBLIC }}
        run: node pages/build.mjs
