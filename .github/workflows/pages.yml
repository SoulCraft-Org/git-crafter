name: pages

# Builds Git Crafter's pages (Process and Metrics and goals, pages/build.mjs, and
# its own Quality, Speed and Consumption page at quality/, the template
# measuring this repo through actions/pages with config/quality.json) and
# deploys them to the repo's GitHub Pages site.
#
# Fires on every push to main, once a day and on demand (the github-pages environment
# deploys from main only). On a pull request that touches the pages, their
# data or this file, it builds and screenshots without deploying, so a broken
# page shows before merge. A pull request that touches a doc (**/*.md, the doc set) runs docs-gate, and a doc-only
# one runs nothing else (changes, below). The daily schedule (the owner's yes, plan call 3, 2026-11-12) runs as a
# push to main does: the App token's admin reads, the main-reads save and the deploy, so the scores and
# settings.admin_read_age_hours (goal 24) stay current between merges. It takes no screenshots.
# A committed data/org.json is read as it is; with none (a public copy or a fork), the build
# collects it with GITHUB_TOKEN first, and a read the token refuses is not measured.
#
# visual-check: headless Chrome on the runner (ubuntu-latest ships Google
# Chrome, so nothing is downloaded) screenshots both pages at desktop and phone
# widths, plus one open step and one open goal, and uploads the PNGs as the
# page-screenshots artifact. Nothing renders on the Mac.
#
# code-gate: a pull request that touches a tool, knip's config or a doc, and nothing build covers, reads the Code
# tab alone and fails on a gated Code count over its limit; build runs the same gate otherwise.
#
# changes (#189): on a pull request, a change to a doc (**/*.md) runs docs-gate on ubuntu-slim: quality/docs-gate.mjs
# fails a doc made worse than on the base branch, and a doc-only change also runs the docs.unmapped gate through
# quality/collect.mjs on the documentation tab (build runs it otherwise). Any other path in the trigger list, or a
# workflow file, runs build. The action jobs run only on a pull request that touches the action's own paths (ACTION
# below), or on a dispatch; a push to main runs build and deploy alone. Each action run spends about 140 GITHUB_TOKEN
# REST calls of the repo's hourly limit, which setup-node shares (#274). The paths are tools/ci_standard.py changes,
# the CI standard's one path filter, called with --output.
#
# action: runs actions/pages on Git Crafter itself, as a repo's workflow calls it
# (tests/action-config.json), so a broken action shows here before any repo
# pins it. It reads this repo with GITHUB_TOKEN and uploads process.html as
# the action-page artifact; it deploys nothing. The Quality page's one-job
# run is the build job's deploy step. action-collect and action-render run
# both pages in the action's two halves, on two runners, as a repo runs them
# beside and after its build. action-collect first collects the Process page
# alone, the one path that used to skip the action's install (#650).
#
# runner: the overflow switch (templates/ci/DECISIONS.md, 2026-11-10). Off, the repo variable CI_OVERFLOW_RUNNER is
# unset, runner is skipped, and every job runs on the GitHub label it names. On, it holds a lane's label from
# .github/ci-overflow.json: tools/ci_overflow.py sums this cycle's minutes on that lane from GitHub's run and job data
# and hands the label to action, action-collect, action-render and build until the lane's stop, then ubuntu-latest.
# Anything it cannot read is ubuntu-latest too. deploy stays on GitHub: it holds pages: write and an OIDC token.
# gh-replay (#38): action-collect and build replay main's public reads; no collector changed shows main's scored run.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pages/**"
      - "goals.json"
      - "process.json"
      - "maps.json"
      - "data/**"
      - "tools/**"
      - "knip.json"
      - "quality/**"
      - "config/quality.json"
      - "config/quality/**"
      - "package.json"
      - "package-lock.json"
      - "actions/**"
      - "tests/action-config.json"
      - ".github/workflows/pages.yml"
      - "**/*.md"
  # Daily, off the hour (the owner's yes, plan call 3, 2026-11-12).
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run (#189). A deploy on main that has started runs to the
# end; a newer push waits for it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    if: vars.CI_OVERFLOW_RUNNER != ''
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      label: ${{ steps.choose.outputs.label }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Exits 0 and names a label whatever it reads; continue-on-error keeps a crash on ubuntu-latest as well.
      - id: choose
        continue-on-error: true
        env:
          CI_OVERFLOW_RUNNER: ${{ vars.CI_OVERFLOW_RUNNER }}
          CI_OVERFLOW_SAVE: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I tools/ci_overflow.py choose --state-out "$RUNNER_TEMP/ci-overflow/state.json"
      # The meter's state for the next run; only main's is read back.
      - uses: actions/upload-artifact@v7.0.2
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && steps.choose.outputs.artifact != ''
        continue-on-error: true
        with:
          name: ${{ steps.choose.outputs.artifact }}
          path: ${{ runner.temp }}/ci-overflow/state.json
          retention-days: 35
          if-no-files-found: ignore

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
      docs: ${{ steps.changes.outputs.docs }}
      action: ${{ steps.changes.outputs.action }}
      code: ${{ steps.changes.outputs.code }}
      collect: ${{ steps.changes.outputs.collect }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The pull_request paths above, less **/*.md, make full; a doc makes docs.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FULL: |
            pages/**
            goals.json
            process.json
            maps.json
            data/**
            tools/collect_org.mjs
            tools/systems.mjs
            tools/workflows.mjs
            quality/**
            config/quality.json
            config/quality/**
            package.json
            package-lock.json
            actions/**
            tests/action-config.json
          # The action jobs test actions/pages itself; a change to the page engine, its data or the Quality
          # collectors alone is built by the build job (#274).
          ACTION: |
            actions/**
            tests/action-config.json
            tools/collect_org.mjs
            tools/systems.mjs
            tools/workflows.mjs
            pages/**
            package.json
            package-lock.json
          # Code or a doc that draws it, outside FULL: code-gate reads the Code tab alone. Build runs the same
          # gate for every code path FULL holds.
          CODE: |
            tools/**
            knip.json
            **/*.md
          COLLECT: |
            quality/**
            config/**
            data/**
            package*.json
            actions/**
        run: |
          python3 -I tools/ci_standard.py changes --paths="$FULL" --base="$BASE" --output=full
          python3 -I tools/ci_standard.py changes --paths="$CODE" --base="$BASE" --output=code
          python3 -I tools/ci_standard.py changes --paths="**/*.md" --base="$BASE" --output=docs
          python3 -I tools/ci_standard.py changes --paths="$ACTION" --base="$BASE" --output=action
          python3 -I tools/ci_standard.py changes --paths="$COLLECT" --base="$BASE" --output=collect

  # On any pull request that touches a doc: each changed doc against its base (quality/docs-gate.mjs), and on a
  # doc-only one the docs.unmapped gate too, the documentation tab alone with no page built.
  docs-gate:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || (needs.changes.outputs.full == 'true' && needs.changes.outputs.collect != 'true')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # Full history: the docs collector dates each doc against its area's last commit.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The npm cache only where npm ci runs: with none, setup-node's post step finds no cache folder.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ needs.changes.outputs.full != 'true' && 'npm' || '' }}

      # Exits 1 when a changed doc crosses the reading goal, drops under the visual bar or gains a heading or
      # image fault, naming each with its old and new value and the goal. It loads no package.
      - name: No doc worse than on the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node quality/docs-gate.mjs --base "$BASE" --config config/quality.json

      - name: Install Git Crafter's packages
        if: needs.changes.outputs.collect != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      # collect.mjs exits 3 when a gate metric misses its goal, naming each row.
      - name: The docs.unmapped gate
        if: needs.changes.outputs.collect != 'true'
        run: |
          set -euo pipefail
          node -e 'const fs = require("fs"); const c = JSON.parse(fs.readFileSync("config/quality.json", "utf8"));
            fs.writeFileSync(process.argv[1], JSON.stringify({ ...c, tabs: ["documentation"] }))' "$RUNNER_TEMP/docs-gate.json"
          node quality/collect.mjs --config "$RUNNER_TEMP/docs-gate.json" --out "$RUNNER_TEMP/docs-gate-run.json"

  # On a pull request that touches a tool, knip's config or a doc, and nothing build covers: the Code tab alone,
  # with no page built. collect.mjs exits 3 when a Code metric gated in config/quality/targets/code.json misses its
  # goal, naming each row. It reads files and git only: no GITHUB_TOKEN call.
  code-gate:
    needs: changes
    if: needs.changes.outputs.collect != 'true' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.full == 'true')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # Full history: code.missing_refs reads git log for files that were once committed.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Git Crafter's packages
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      - name: No Code count over its limit
        run: |
          set -euo pipefail
          node -e 'const fs = require("fs"); const c = JSON.parse(fs.readFileSync("config/quality.json", "utf8"));
            fs.writeFileSync(process.argv[1], JSON.stringify({ ...c, tabs: ["code"] }))' "$RUNNER_TEMP/code-gate.json"
          node quality/collect.mjs --config "$RUNNER_TEMP/code-gate.json" --out "$RUNNER_TEMP/code-gate-run.json"

  action:
    needs: [changes, runner]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.action == 'true') }}
    runs-on: ${{ needs.runner.outputs.label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      # Dependabot's open alerts, read live on every run (security.dependabot_open, security.malware_open).
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      # The Quality page's one-job run is the build job's deploy step.
      - uses: $/actions/pages
        with:
          config: tests/action-config.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: action-page
          path: pages/dist/action/process.html
          retention-days: 7
          if-no-files-found: error

  action-collect:
    needs: [changes, runner]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.action == 'true') }}
    runs-on: ${{ needs.runner.outputs.label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      deployments: read
      # Dependabot's open alerts, read live on every run (security.dependabot_open, security.malware_open).
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: replay
        run: node quality/gh-replay.mjs setup
        env:
          GH_TOKEN: ${{ github.token }}

      # The Process page alone in mode collect, as a repo's process-collect job calls the action (#650). It runs
      # first: the action's copy of the repo holds no package yet, so an install the action skips fails here.
      # Cost: one more Process API half; its log line gives the REST and GraphQL calls.
      - uses: $/actions/pages
        with:
          config: tests/action-config.json
          mode: collect
          artifact: action-process-api

      - uses: $/actions/pages
        with:
          pages: process quality
          config: tests/action-config.json
          quality-config: config/quality.json
          mode: collect
          artifact: action-split-api

      - if: always()
        run: node quality/gh-replay.mjs report

      # $/actions/pages runs from its own copy of the repo, so its npm ci leaves
      # this checkout without packages; the keyboard pass needs them here.
      - name: Install Git Crafter's packages
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      # The usability keyboard pass in a real Chrome, which this runner has and
      # verify.sh's ubuntu-slim does not. A browser that fails to start fails this step, and so
      # does a run with no passing test named "... in Chrome": node --test
      # passes a pattern that matches nothing, counting the file as one test.
      - name: Keyboard pass in Chrome
        shell: bash
        env:
          QUALITY_REQUIRE_CHROME: "1"
        run: |
          node --test --test-reporter=tap --test-name-pattern="in Chrome" quality/collectors/site/usability.test.mjs | tee "$RUNNER_TEMP/chrome.tap"
          grep -Eq '^ *ok [0-9]+ - [^#]*in Chrome$' "$RUNNER_TEMP/chrome.tap" || { echo "::error::no test named \"... in Chrome\" passed"; exit 1; }

  action-render:
    needs: [action-collect, runner]
    if: ${{ !cancelled() && needs.action-collect.result == 'success' }}
    runs-on: ${{ needs.runner.outputs.label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: $/actions/pages
        with:
          pages: process quality
          config: tests/action-config.json
          quality-config: config/quality.json
          mode: render
          artifact: action-split-api

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: action-split-page
          path: |
            pages/dist/action/process.html
            pages/dist/quality/index.html
          retention-days: 7
          if-no-files-found: error

  build:
    needs: [changes, runner, action-collect]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.full == 'true') }}
    runs-on: ${{ needs.runner.outputs.label || 'ubuntu-latest' }}
    timeout-minutes: 15
    # The Quality page's collectors read this repo's pull requests, runs,
    # checks, issues and deployments (the deploy.* metrics) with GITHUB_TOKEN;
    # a read it refuses is not measured.
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
      issues: read
      pull-requests: read
      # Dependabot's open alerts, read live on every run (security.dependabot_open, security.malware_open).
      vulnerability-alerts: read
    env:
      BOARD_APP_KEY_SET: ${{ secrets.BOARD_APP_KEY != '' }}
    steps:
      # Full history: the docs collector dates each doc against its area's
      # last commit.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Process page reads the Quality page's definitions (yaml), to check
      # and rate each map step.
      - name: Install Git Crafter's packages
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      # gh-replay.mjs records on a push to main; the daily run on main records the same way, under the push's
      # event name for this one step.
      - id: replay
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then export GITHUB_EVENT_NAME=push; fi
          node quality/gh-replay.mjs setup
        env:
          GH_TOKEN: ${{ github.token }}

      # Main's CI runs, one a UTC day, from the quality-history branch (the deploy job's issue-sync steps write them), beside the local
      # snapshots main holds; a day main holds wins (cp -n). They draw each map step's trend line and the
      # Quality page's weekly figures. One REST call; no branch yet reads nothing.
      - name: CI history from the quality-history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qh" data/quality/history
          if gh api "repos/$GITHUB_REPOSITORY/tarball/quality-history" > "$RUNNER_TEMP/qh.tgz" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/qh.tgz" -C "$RUNNER_TEMP/qh" --strip-components=1
            find "$RUNNER_TEMP/qh/history" -maxdepth 1 -name '*.json' -exec cp -n {} data/quality/history/ \; 2>/dev/null || true
          else
            echo "no quality-history branch yet"
          fi
          echo "$(ls data/quality/history | wc -l) history file(s)"

      - name: Build both pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f data/org.json ] || node tools/collect_org.mjs
          node pages/build.mjs | tee build.log
          { echo "### Page sizes"; echo; sed 's/^wrote /- /' build.log; } >> "$GITHUB_STEP_SUMMARY"

      # The git-crafter-bot App's installation token, read-only and one hour long, minted on main only: it reads
      # the needs: github-admin metrics (settings, alerts, secret names, never values) and the needs: project-scope ones (the board).
      # No App key skips it.
      - id: admin-app
        if: github.ref == 'refs/heads/main' && env.BOARD_APP_KEY_SET == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.BOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOARD_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-code-quality: read
          permission-environments: read
          permission-secrets: read
          permission-secret-scanning-alerts: read
          permission-security-events: read
          permission-vulnerability-alerts: read
          permission-organization-administration: read
          permission-members: read
          permission-organization-projects: read

      # admin-read-token (#837): the ADMIN_READ_TOKEN secret, a fine-grained read-only token, else the App token
      # above, on main only, so a branch's code never runs with it. Neither, those metrics stay not measured.
      # hf-token and openrouter-api-key (#836): the HF_TOKEN and OPENROUTER_API_KEY usage keys, on main only the
      # same way, for the Credits provider readers. Unset, those stay not read in CI.
      - name: Quality page from main's scored run, no collector changed
        if: steps.replay.outputs.latest == 'true' && needs.changes.outputs.collect != 'true'
        run: node quality/collect.mjs --config config/quality.json --from "$GH_REPLAY_DIR/latest.json" && node quality/build.mjs --config config/quality.json

      - name: Git Crafter's own Quality, Speed and Consumption page
        if: steps.replay.outputs.latest != 'true' || needs.changes.outputs.collect == 'true'
        uses: $/actions/pages
        with:
          pages: quality
          mode: ${{ github.event_name == 'pull_request' && needs.action-collect.result == 'success' && 'render' || 'all' }}
          artifact: action-split-api
          quality-config: config/quality.json
          admin-read-token: ${{ github.ref == 'refs/heads/main' && (secrets.ADMIN_READ_TOKEN || steps.admin-app.outputs.token) || '' }}
          hf-token: ${{ github.ref == 'refs/heads/main' && secrets.HF_TOKEN || '' }}
          openrouter-api-key: ${{ github.ref == 'refs/heads/main' && secrets.OPENROUTER_API_KEY || '' }}

      # The first build ran before the Quality run existed, so its map steps read none. This one reads the
      # run the step above wrote (data/quality/latest.json) and keeps data/org.json, so the site metrics keep
      # their readings. Process and Metrics only: the Quality page stays as the step above wrote it.
      - name: Build the Process page again from this run
        run: node pages/build.mjs

      - if: always()
        run: node quality/gh-replay.mjs report

      - uses: actions/upload-artifact@v7.0.2
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        with:
          name: main-reads
          path: ${{ runner.temp }}/gh-replay/
          retention-days: 2
          if-no-files-found: error

      # The shots are for a reviewer of a pull request, which took them on its own run. A push to main repeated
      # them for no reader (44 of the build's 137 s, run 42969770326), so main skips them; its pages still build,
      # score and deploy. The daily run on main skips them too.
      - name: visual-check
        if: github.event_name != 'push' && github.event_name != 'schedule'
        run: |
          set -euo pipefail
          mkdir -p shots
          shot() {
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --virtual-time-budget=4000 \
              --window-size="$2" --screenshot="shots/$1.png" "file://$PWD/pages/dist/$3"
          }
          shot process-1440 1440,1900 index.html
          shot process-step-ci-1440 1440,1900 "index.html#step-delivery-ci"
          shot process-triage-1440 1440,1900 "index.html#step-triage-intake"
          shot process-390 390,2600 index.html
          shot process-ci-1440 1440,3200 "index.html#tab=ci"
          shot process-testing-1440 1440,2600 "index.html#tab=testing"
          shot process-ci-390 390,5200 "index.html#tab=ci"
          shot process-testing-390 390,4400 "index.html#tab=testing"
          shot process-claude-1440 1440,3200 "index.html#tab=claude"
          shot process-tokens-1440 1440,2800 "index.html#tab=tokens"
          shot process-tokens-390 390,5600 "index.html#tab=tokens"
          shot process-systems-1440 1440,2000 "index.html#tab=systems"
          shot process-systems-390 390,3600 "index.html#tab=systems"
          shot process-claude-390 390,5000 "index.html#tab=claude"
          shot metrics-top-1440 1440,1300 metrics.html
          shot metrics-1440 1440,5200 metrics.html
          shot metrics-goal-open-1440 1440,1400 "metrics.html#goal-ci-pass"
          shot metrics-390 390,7600 metrics.html
          shot quality-1440 1440,2400 quality/index.html
          shot quality-actions-1440 1440,1300 "quality/index.html#actions"
          shot quality-390 390,5200 quality/index.html
          ls -la shots

      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'push' && github.event_name != 'schedule'
        with:
          name: page-screenshots
          path: shots/
          # A day is enough to look at a run's shots; 7 days held 3.6 GB of artifacts on 2026-11-10.
          retention-days: 1

      # The scored run, for the deploy job's issue-sync steps below.
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: quality-run
          path: data/quality/latest.json
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: pages/dist

  # deploy, then issue-sync, in one job (2026-11-11): two ubuntu-slim jobs billed a minute each, about 45 s in all
  # (run 43093174588), so one job saves a billed minute on every push to main. It holds both jobs' grants, on main
  # only: pages: write and an OIDC token for the deploy; contents: write and issues: write for the sync, which also
  # reads Pages (pages: write covers read) to link each metric to the Quality page. Both ran main's own code before;
  # the github-pages environment deploys from main alone. deploy stays on GitHub (runner, above).
  # The deploy goes first: one JavaScript action with no checkout, so the pages publish as soon as the job starts.
  # issue-sync: quality/sync-issues.mjs keeps one board card, or for a quick fix one issue, per metric that misses its
  # goal (config/quality.json issue_sync), and quality/history-push.mjs keeps the run as history/<date>.json on the
  # quality-history branch, at most one a UTC day; main stays protected by its ruleset. The sync runs after a failed
  # deploy too, as its own job did: it needs only the scored run.
  deploy:
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BOARD_APP_KEY_SET: ${{ secrets.BOARD_APP_KEY != '' }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

      - uses: actions/checkout@v7.0.1
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Git Crafter's packages
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      - uses: actions/download-artifact@v8.0.2
        if: ${{ !cancelled() }}
        with:
          name: quality-run
          path: data/quality

      # The board app's token writes the org project's cards, which the Actions token cannot; no key skips it.
      - id: board
        if: ${{ !cancelled() && env.BOARD_APP_KEY_SET == 'true' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.BOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOARD_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write

      - name: Sync missed metrics to board cards and quick-fix issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ steps.board.outputs.token }}
        run: node quality/sync-issues.mjs --config config/quality.json

      # Warns and passes when GitHub refuses the write: a missing day is a gap in a trend line.
      - name: Keep the day's run as a history file
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node quality/history-push.mjs data/quality/latest.json
