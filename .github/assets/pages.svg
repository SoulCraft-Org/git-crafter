<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#0b0b0b">
<title id="t">Diagram of the two pages Git Crafter builds for a repo</title>
<desc id="d">A schematic with sample numbers, not real data. Left, the Quality, Speed and Consumption page: a header with commit and build time, a strip of tabs with small scores, a master score out of 100, three category scores with bars, a bar of metrics that meet, near or miss their goal, and a work queue. Right, the Process page: its maps drawn as trails of steps, and one open step listing its tool, its rule and its metric, which is read from the Quality page.</desc>
