# Groups for GitHub's generated release notes (gh release create <tag> --generate-notes). Each group but Dependencies
# names labels that exist on Git Crafter. `dependencies` does not exist yet: Dependabot creates it with its first pull
# request (GitHub Docs, Dependabot options reference, read 2026-11-13). "*" catches each pull request no group above
# matched, so it stays last. Format: GitHub Docs, "Automatically generated release notes", read 2026-11-13.
changelog:
  categories:
    - title: Security
      labels: [security]
    - title: Fixes
      labels: [bug]
    - title: Features
      labels: [enhancement]
    - title: Quality page and CI
      labels: [quality, ci]
    - title: Pages and accessibility
      labels: [pages, accessibility]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
